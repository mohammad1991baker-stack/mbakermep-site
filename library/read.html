<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading — Mohammad Baker Library</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Reem+Kufi:wght@600&family=Readex+Pro:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/library/lib.css">
<script src="/library/lib.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  html,body{height:100%}
  body{display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none}
  header.top .wrap{width:calc(100% - 24px)}
  #stage{position:relative;flex:1;min-height:0;background:var(--wall)}
  #frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  #wm{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2;
      background-repeat:repeat;opacity:.11}
  #state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:3;background:var(--stone)}
  #state .card{max-width:460px}
  .bar{height:4px;background:var(--rule);border-radius:4px;overflow:hidden;margin-top:14px}
  .bar i{display:block;height:100%;width:0;background:var(--brass);transition:width .2s}
  @media print{body{display:none!important}}
</style>
<script data-goatcounter="https://mbakermep.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="mark" href="/library/"><svg viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="9" y="9" width="22" height="22"/><rect x="9" y="9" width="22" height="22" transform="rotate(45 20 20)"/><circle cx="20" cy="20" r="4.2"/></g></svg><span class="en">LIBRARY</span><span class="ar">المكتبة</span></a>
  <nav class="tn"><span class="muted hide-s" id="title"></span><button class="lang" id="langBtn"><span class="en">العربية</span><span class="ar">English</span></button></nav>
</div></header>
<div id="stage">
  <iframe id="frame" title="Book" sandbox="allow-scripts allow-same-origin allow-forms allow-popups-to-escape-sandbox" hidden></iframe>
  <div id="wm" hidden></div>
  <div id="state"><div class="card">
    <p id="stateText"><span class="en">Opening the book…</span><span class="ar">جاري فتح الكتاب…</span></p>
    <div class="bar" id="bar"><i id="barFill"></i></div>
    <p class="row" style="justify-content:center"><a class="btn ghost" href="/library/"><span class="en">Back to library</span><span class="ar">رجوع للمكتبة</span></a></p>
  </div></div>
</div>
<script>
(async function () {
  const state = document.getElementById("state"), stateText = document.getElementById("stateText");
  function stop(en, ar) { state.hidden = false; document.getElementById("bar").hidden = true; stateText.textContent = LIBT(en, ar); document.getElementById("frame").remove(); }
  document.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && /^[spu]$/i.test(e.key)) e.preventDefault(); });

  const slug = new URLSearchParams(location.search).get("b");
  if (!slug || LIB.SUPABASE_URL.indexOf("__") === 0) return stop("Book not found.", "الكتاب غير موجود.");
  const sb = libClient();
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = "/library/"; return; }
  const email = session.user.email.toLowerCase();

  const { data: book } = await sb.from("books").select("slug,title_en,title_ar,file_path").eq("slug", slug).maybeSingle();
  if (!book) return stop("Book not found.", "الكتاب غير موجود.");
  const setTitle = () => document.getElementById("title").textContent = LIBT(book.title_en, book.title_ar);
  setTitle(); document.addEventListener("langchange", setTitle);

  // one open session per account
  const sid = crypto.randomUUID();
  await sb.from("active_sessions").upsert({ email, session_id: sid, updated_at: new Date().toISOString() });
  const timer = setInterval(async () => {
    const { data } = await sb.from("active_sessions").select("session_id").eq("email", email).maybeSingle();
    if (data && data.session_id !== sid) {
      clearInterval(timer);
      stop("This account was opened on another device, so the book closed here. Open it again to continue.",
           "انفتح هالحساب على جهاز ثاني، فتسكّر الكتاب هون. افتحه من جديد لتكمل.");
    }
  }, 45000);

  // download the book (storage only answers subscribers)
  let blob;
  try {
    const { data: signed, error } = await sb.storage.from("library").createSignedUrl(book.file_path, 60);
    if (error || !signed) throw error || new Error("denied");
    const res = await fetch(signed.signedUrl);
    if (!res.ok) throw new Error("denied");
    const total = +res.headers.get("content-length") || 0, reader = res.body.getReader(), parts = []; let got = 0;
    for (;;) { const { done, value } = await reader.read(); if (done) break; parts.push(value); got += value.length;
      if (total) document.getElementById("barFill").style.width = Math.round(got / total * 100) + "%"; }
    blob = new Blob(parts);
    if (book.file_path.endsWith(".gz")) blob = await new Response(blob.stream().pipeThrough(new DecompressionStream("gzip"))).blob();
  } catch (e) {
    return stop("Your subscription does not cover this book, or it has expired.", "اشتراكك ما بيشمل هالكتاب، أو انتهى.");
  }

  // watermark with the reader's email
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220"><text x="20" y="130" transform="rotate(-24 180 110)" font-family="sans-serif" font-size="15" fill="#1D2232">' +
    email.replace(/[<&]/g, "") + "</text></svg>";
  const wm = document.getElementById("wm"); wm.style.backgroundImage = 'url("data:image/svg+xml;utf8,' + encodeURIComponent(svg) + '")'; wm.hidden = false;

  const html = await blob.text();
  const guard = "<style>@media print{body{display:none!important}}</style><script>document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('copy',e=>e.preventDefault());document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&/^[spu]$/i.test(e.key))e.preventDefault()});<\/script>";
  const url = URL.createObjectURL(new Blob([html.replace(/<\/head>/i, guard + "</head>")], { type: "text/html" }));
  const frame = document.getElementById("frame"); frame.src = url; frame.hidden = false; state.hidden = true;
})();
</script>
</body>
</html>
